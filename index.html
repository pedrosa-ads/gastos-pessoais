<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e30"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./assets/styles.css"><title>Meus Gastos Família</title></head>
<body><header><div class="wrap"><h1>Meus Gastos <small>Família</small></h1><button id="logout" hidden>Sair</button></div></header><main class="wrap">
<section id="setup" class="card" hidden><h2>Configuração pendente</h2><p>Crie <code>config.js</code> a partir de <code>config.example.js</code> com as credenciais públicas do novo Supabase. Veja o README.</p></section>
<section id="login" class="card" hidden><h2>Entrar</h2><form id="login-form"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Senha<input type="password" id="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<div id="app" hidden><section class="card hero"><div><span>Total do mês</span><strong id="total">R$ 0,00</strong></div><label>Mês<input type="month" id="month"></label></section>
<section class="card"><h2 id="form-title">Nova despesa</h2><form id="expense-form"><input type="hidden" id="expense-id"><div class="fields"><label>Descrição<input id="description" placeholder="Ex.: farmácia 85,90" required></label><label>Valor (R$)<input id="amount" inputmode="decimal" placeholder="85,90" required></label><label>Data<input id="date" type="date" required></label><label>Categoria<select id="category"></select></label></div><button id="save">Salvar despesa</button><button type="button" id="cancel" class="secondary" hidden>Cancelar edição</button></form></section>
<section class="card"><h2>Gastos por categoria</h2><p class="hint">Clique em uma categoria para ver os lançamentos.</p><div id="categories"></div></section>
<section class="card"><div class="head"><h2 id="list-title">Lançamentos do mês</h2><button id="clear-filter" class="secondary" hidden>Ver todos</button></div><div id="expenses"></div></section></div><p id="message" role="status"></p></main><script src="./config.js"></script><script type="module" src="./assets/app.js"></script></body></html>
